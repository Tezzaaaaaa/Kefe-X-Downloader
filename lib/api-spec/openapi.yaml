openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: videos
    description: Video download operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /videos/formats:
    post:
      operationId: listVideoFormats
      tags: [videos]
      summary: List available video quality options for a video URL
      description: >
        Accepts a URL supported by yt-dlp and returns the available video
        quality/format options without downloading the video, so the user
        can pick one before committing to a download.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoRequest"
      responses:
        "200":
          description: Available formats for the post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoFormatsResponse"
        "400":
          description: Invalid or unsupported URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Could not find any video formats for the given URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /videos:
    post:
      operationId: createVideoDownload
      tags: [videos]
      summary: Resolve and download a video from a URL
      description: >
        Accepts a URL supported by yt-dlp, downloads the video server-side,
        and returns metadata plus a link to fetch the downloaded file.
        Optionally accepts a formatId (from listVideoFormats) to select a
        specific quality; otherwise the best available quality is used.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoRequest"
      responses:
        "201":
          description: Video downloaded and ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "400":
          description: Invalid or unsupported URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Could not extract a video from the given URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /videos/{id}/file:
    get:
      operationId: getVideoFile
      tags: [videos]
      summary: Download the fetched video file
      description: >
        Streams the previously downloaded video file. Intended to be used
        directly as a link/anchor href, not via a fetch call.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The video file
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "404":
          description: Video not found or file expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    VideoRequest:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          description: The post URL to extract a video from
        formatId:
          type: ["string", "null"]
          description: >
            Optional format identifier (from listVideoFormats) selecting a
            specific quality. If omitted, the best available quality is used.
    VideoFormat:
      type: object
      required:
        - formatId
        - label
      properties:
        formatId:
          type: string
        label:
          type: string
          description: Human-readable quality label, e.g. "1080p" or "Audio only"
        height:
          type: ["integer", "null"]
        width:
          type: ["integer", "null"]
        ext:
          type: ["string", "null"]
        fileSizeBytes:
          type: ["integer", "null"]
    VideoFormatsResponse:
      type: object
      required:
        - sourceUrl
        - formats
      properties:
        sourceUrl:
          type: string
        title:
          type: ["string", "null"]
        thumbnailUrl:
          type: ["string", "null"]
        durationSeconds:
          type: ["number", "null"]
        formats:
          type: array
          items:
            $ref: "#/components/schemas/VideoFormat"
    Video:
      type: object
      required:
        - id
        - sourceUrl
        - downloadUrl
        - createdAt
      properties:
        id:
          type: string
        sourceUrl:
          type: string
        title:
          type: ["string", "null"]
        thumbnailUrl:
          type: ["string", "null"]
        durationSeconds:
          type: ["number", "null"]
        fileSizeBytes:
          type: ["integer", "null"]
        downloadUrl:
          type: string
          description: Relative path (under the API base) to fetch the video file
        createdAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
